[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rag-ingest"
version = "0.2.0"
description = "Event-driven document ingestion for RAG: S3 -> SQS -> Lambda, with deduplication, rate limiting and DLQ redrive"
readme = "README.md"
requires-python = ">=3.11"
# boto3 ships with the Lambda Python runtime, so the deployment package has no dependencies.
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["boto3>=1.34", "moto[s3,dynamodb]>=5", "pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
